    </radialGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#glass)" />
  <circle cx="49" cy="17" r="13" fill="url(#dawn)" />
  <rect x="2.5" y="2.5" width="59" height="59" rx="17.5" fill="none" stroke="#a7c6f2" stroke-opacity="0.5" />

