      <stop stop-color="#142b45" />
      <stop offset="0.52" stop-color="#091a2d" />
      <stop offset="1" stop-color="#040b16" />
    </linearGradient>
    <radialGradient id="dawn" cx="0" cy="0" r="1" gradientTransform="translate(49 17) rotate(90) scale(13)">
      <stop stop-color="#ffb26f" stop-opacity="0.34" />
