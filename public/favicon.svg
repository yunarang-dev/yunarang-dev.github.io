<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Yunarang constellation mark</title>
  <desc id="desc">A constellation shaped like the letter Y with a warm dawn star.</desc>
  <defs>
